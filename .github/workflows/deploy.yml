# Publishes the site to GitHub Pages under  /<repo>/me/
# e.g. repo "invitation"  →  https://<username>.github.io/invitation/me/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}me/
    steps:
      - uses: actions/checkout@v4

      - name: Build site into /me
        run: |
          mkdir -p _site/me
          cp -r index.html assets _site/me/
          cp redirect.html _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
